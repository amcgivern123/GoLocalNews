# Publishes the whole network whenever an article or setting changes,
# and every morning so scheduled stories appear and old offers drop off.
# Secrets needed (GitHub > Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY  - for the local intros (optional; skipped if missing)
#   DEPLOY_HOST        - e.g. youruser@yourserver.knownhost.com
#   DEPLOY_SSH_KEY     - private SSH key that can log in to KnownHost
#   DEPLOY_PORT        - optional, if your SSH port isn't 22
name: Publish network

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * *"   # about 5am UK time
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write local intros
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run localise

      - name: Save new intros back to the repository
        run: |
          if [ -n "$(git status --porcelain src/content/intros)" ]; then
            git config user.name "publish-bot"
            git config user.email "publish-bot@users.noreply.github.com"
            git add src/content/intros
            git commit -m "Add local intros"
            git push
          fi

      - name: Build every site
        run: npm run build:all

      - name: Upload to KnownHost
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then echo "Deploy secrets not set yet, skipping upload."; exit 0; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Strip Windows line endings and make sure the key ends with a newline.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          SERVER="${DEPLOY_HOST#*@}"
          echo "--- Reaching $SERVER on port ${DEPLOY_PORT:-22} ---"
          if ssh-keyscan -T 15 -p "${DEPLOY_PORT:-22}" "$SERVER" > /tmp/hostkeys 2>/tmp/scanerr && [ -s /tmp/hostkeys ]; then
            cat /tmp/hostkeys >> ~/.ssh/known_hosts
            echo "Server reached."
          else
            echo "WARNING: could not read the server's identity: $(tail -n 3 /tmp/scanerr)"
            echo "If this keeps happening, the server's firewall may be blocking GitHub (ask KnownHost)."
          fi
          export SSH_EXTRA="-o StrictHostKeyChecking=accept-new"

          echo "--- Key check (safe to share) ---"
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/derived.pub 2>/tmp/keyerr; then
            echo "KEY PROBLEM: DEPLOY_SSH_KEY is not a usable private key: $(cat /tmp/keyerr)"
            echo "Re-copy the PRIVATE key from cPanel (with no passphrase), from -----BEGIN to -----END."
            exit 1
          fi
          ssh-keygen -l -f /tmp/derived.pub
          echo "Public key ends with: ...$(awk '{print $2}' /tmp/derived.pub | tail -c 25)"
          echo "Compare that ending with the public key authorized in cPanel."

          echo "--- Login test for the first site in deploy.json ---"
          FIRST_USER=$(node -e 'const d=require("./deploy.json");const v=Object.values(d)[0];console.log(typeof v==="string"?process.env.DEPLOY_HOST.split("@")[0]:v.user)')
          ssh -v -p "${DEPLOY_PORT:-22}" -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes $SSH_EXTRA "$FIRST_USER@$SERVER" true 2>&1 \
            | grep -E "Authenticating to|Offering public key|Server accepts key|Authenticated to|Authentications that can continue|Permission denied|Load key|invalid format" || true

          DEPLOY_SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes $SSH_EXTRA" npm run deploy
